<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Header Hunter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Redirect Path</h1>
      <button id="copyBtn" title="Copy chain">Copy to Clipboard</button>
    </header>

    <section id="meta">
      <div id="status">Waiting for data…</div>
      <div id="journey" class="journey"></div>
      <div id="cacheSummary" class="cache-summary"></div>
    </section>

    <section id="hops"></section>

    <template id="hopTemplate">
      <div class="hop">
        <div class="hop-row">
          <span class="badge"></span>
          <span class="url"></span>
          <span class="code"></span>
        </div>
        <div class="details">
          <div class="summary"></div>
          <table class="headers"></table>
        </div>
      </div>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
